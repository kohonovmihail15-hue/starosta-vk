      {/* ==================== MODAL: CREATE FUND COLLECTION ==================== */}
      {fundModal.open && (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
          <div
            className={`w-full max-w-md rounded-2xl border p-5 space-y-4 ${
              darkMode
                ? 'bg-slate-900 border-slate-800 text-white'
                : 'bg-white border-slate-200 text-slate-900'
            }`}
          >
            <div className="flex items-center justify-between">
              <h3 className="font-bold text-base">Открыть сбор в группе</h3>
              <button
                onClick={() => setFundModal({ ...fundModal, open: false })}
                className="p-1 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800"
              >
                <X className="w-4 h-4" />
              </button>
            </div>

            <div className="space-y-3 text-xs sm:text-sm">
              <div>
                <label className="block font-semibold mb-1">Цель сбора:</label>
                <input
                  type="text"
                  value={fundModal.title}
                  onChange={(e) =>
                    setFundModal({ ...fundModal, title: e.target.value })
                  }
                  placeholder="На что собираем?"
                  className={`w-full px-3 py-2 rounded-xl border ${
                    darkMode
                      ? 'bg-slate-800 border-slate-700'
                      : 'bg-slate-50 border-slate-200'
                  }`}
                />
              </div>
              <div>
                <label className="block font-semibold mb-1">
                  Сумма с человека (₽):
                </label>
                <input
                  type="number"
                  min={1}
                  value={fundModal.amountPerPerson}
                  onChange={(e) =>
                    setFundModal({
                      ...fundModal,
                      amountPerPerson: e.target.value,
                    })
                  }
                  placeholder="Например: 300"
                  className={`w-full px-3 py-2 rounded-xl border ${
                    darkMode
                      ? 'bg-slate-800 border-slate-700'
                      : 'bg-slate-50 border-slate-200'
                  }`}
                />
              </div>
            </div>

            <div className="flex items-center justify-end gap-2 pt-2">
              <button
                onClick={() => setFundModal({ ...fundModal, open: false })}
                className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-500/10"
              >
                Отмена
              </button>
              <button
                onClick={() => {
                  if (!fundModal.title.trim()) {
                    showToast('Укажите цель сбора');
                    return;
                  }
                  setFunds((prev) => [
                    ...prev,
                    {
                      id: 'f_' + Date.now(),
                      title: fundModal.title.trim(),
                      amountPerPerson: Number(fundModal.amountPerPerson) || 100,
                      paidIds: [],
                    },
                  ]);
                  setFundModal({
                    open: false,
                    title: '',
                    amountPerPerson: '',
                  });
                  showToast('Сбор открыт!');
                }}
                className="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white"
              >
                Открыть сбор
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ==================== MODAL: STUDENT PROFILE, ABSENCES & DATA ==================== */}
      {selectedStudentProfileId &&
        (currentUser.role === 'starosta' ||
          currentUser.role === 'deputy' ||
          currentUser.id === selectedStudentProfileId) && (() => {
          const student = members.find((m) => m.id === selectedStudentProfileId);
          if (!student) return null;

          const studentScheduleStats = Object.entries(attendance)
            .filter(([k]) => k.endsWith('|' + student.id))
            .map(([k, st]) => {
              const [date, pairId] = k.split('|');
              return { pair: schedule.find((p) => p.id === pairId), date, status: st };
            })
            .filter((x) => x.pair)
            .sort((a, b) => b.date.localeCompare(a.date));

          const absentList = studentScheduleStats.filter((x) => x.status === 'absent');
          const lateList = studentScheduleStats.filter((x) => x.status === 'late');
          const excusedList = studentScheduleStats.filter((x) => x.status === 'excused');
          const presentList = studentScheduleStats.filter((x) => x.status === 'present');

          const completedHws = homeworks.filter((hw) =>
            hw.completedBy.includes(student.id)
          );
          const assignedDays = DAYS.filter(
            (d) => dailyDeputyByDay[d.id] === student.id
          );
          const studentQueues = queues.filter((q) =>
            q.entries.some((e) => e.userId === student.id)
          );
          const studentPaidFunds = funds.filter((f) =>
            f.paidIds.includes(student.id)
          );

          return (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div
                className={`w-full max-w-2xl rounded-2xl border p-5 space-y-4 max-h-[90vh] overflow-y-auto ${
                  darkMode
                    ? 'bg-slate-900 border-slate-800 text-white'
                    : 'bg-white border-slate-200 text-slate-900'
                }`}
              >
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-center gap-3">
                    <div
                      className={`w-12 h-12 rounded-2xl text-white font-bold text-lg flex items-center justify-center shrink-0 ${student.avatarColor}`}
                    >
                      {student.name[0]}
                    </div>
                    <div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <h3 className="font-bold text-base sm:text-lg">
                          {student.name}
                        </h3>
                        <span
                          className={`text-[11px] px-2 py-0.5 rounded-full font-bold ${
                            student.role === 'starosta'
                              ? 'bg-blue-500/15 text-[#2688EB]'
                              : student.role === 'deputy'
                              ? 'bg-purple-500/15 text-purple-500'
                              : 'bg-slate-500/15 text-slate-500'
                          }`}
                        >
                          {student.role === 'starosta'
                            ? 'Староста группы'
                            : student.role === 'deputy'
                            ? 'Заместитель старосты'
                            : 'Студент группы'}
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Личная карточка участника • Доступна только самому студенту, старосте и замстаросте
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={() => setSelectedStudentProfileId(null)}
                    className="p-1.5 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>

                {/* All entered student data */}
                <div
                  className={`p-3.5 rounded-xl border grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs ${
                    darkMode
                      ? 'bg-slate-800/60 border-slate-700'
                      : 'bg-slate-50 border-slate-200'
                  }`}
                >
                  <div>
                    <div className="text-slate-400">Профиль ВК:</div>
                    <div className="font-bold mt-0.5">{student.vkTag || 'Не указан'}</div>
                  </div>
                  <div>
                    <div className="text-slate-400">Подгруппа:</div>
                    <div className="font-bold mt-0.5">{student.subgroup}-я подгруппа</div>
                  </div>
                  <div>
                    <div className="text-slate-400">Закрепленная группа:</div>
                    <div className="font-bold mt-0.5 text-[#2688EB]">
                      {groupInfo?.name} ({groupInfo?.code})
                    </div>
                  </div>
                  <div>
                    <div className="text-slate-400">Дежурства (Зам на день):</div>
                    <div className="font-bold mt-0.5">
                      {assignedDays.length > 0
                        ? assignedDays.map((d) => d.short).join(', ')
                        : 'Нет назначений'}
                    </div>
                  </div>
                </div>

                {/* Attendance & Truancy (Прогулы) Summary */}
                <div className="space-y-2.5">
                  <h4 className="font-bold text-xs sm:text-sm uppercase tracking-wider text-slate-400">
                    Статистика посещаемости и прогулов
                  </h4>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs">
                    <div className="p-3 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-600 dark:text-rose-400">
                      <div className="font-bold text-lg">
                        {absentList.length} пар ({absentList.length * 2} ч.)
                      </div>
                      <div className="font-medium">Прогулы (Н)</div>
                    </div>
                    <div className="p-3 rounded-xl border border-amber-500/30 bg-amber-500/10 text-amber-600 dark:text-amber-400">
                      <div className="font-bold text-lg">{lateList.length}</div>
                      <div className="font-medium">Опоздания</div>
                    </div>
                    <div className="p-3 rounded-xl border border-blue-500/30 bg-blue-500/10 text-blue-600 dark:text-blue-400">
                      <div className="font-bold text-lg">{excusedList.length}</div>
                      <div className="font-medium">Уважительные</div>
                    </div>
                    <div className="p-3 rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
                      <div className="font-bold text-lg">{presentList.length}</div>
                      <div className="font-medium">Присутствовал(а)</div>
                    </div>
                  </div>

                  {/* Detailed list of classes and marks */}
                  {schedule.length > 0 && (
                    <div
                      className={`p-3 rounded-xl border max-h-48 overflow-y-auto space-y-1.5 text-xs ${
                        darkMode
                          ? 'bg-slate-800/40 border-slate-700'
                          : 'bg-slate-50 border-slate-200'
                      }`}
                    >
                      {studentScheduleStats.map(({ pair, status, date }) => (
                        <div
                          key={`${pair.id}-${date}`}
                          className="flex items-center justify-between gap-2 py-1 border-b last:border-b-0 border-slate-200/60 dark:border-slate-700/60"
                        >
                          <div>
                            <span className="font-semibold text-[#2688EB]">
                              [{date} • {DAYS.find((d) => d.id === pair.day)?.short}]
                            </span>{' '}
                            <span className="font-medium">{pair.subject}</span>{' '}
                            <span className="text-slate-400">({pair.time})</span>
                          </div>
                          <span
                            className={`px-2 py-0.5 rounded font-bold text-[11px] ${
                              status === 'absent'
                                ? 'bg-rose-600 text-white'
                                : status === 'late'
                                ? 'bg-amber-500 text-white'
                                : status === 'excused'
                                ? 'bg-blue-600 text-white'
                                : 'bg-emerald-600/15 text-emerald-600 dark:text-emerald-400'
                            }`}
                          >
                            {status === 'absent'
                              ? 'Н (Прогул)'
                              : status === 'late'
                              ? 'Опоздал'
                              : status === 'excused'
                              ? 'Уважит.'
                              : 'Был'}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Homework, Queues, Funds & Permissions Data */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs">
                  <div
                    className={`p-3 rounded-xl border ${
                      darkMode
                        ? 'bg-slate-800/50 border-slate-700'
                        : 'bg-slate-50 border-slate-200'
                    }`}
                  >
                    <div className="text-slate-400">Выполнено ДЗ:</div>
                    <div className="font-bold text-sm mt-0.5">
                      {completedHws.length} из {homeworks.length} заданий
                    </div>
                  </div>
                  <div
                    className={`p-3 rounded-xl border ${
                      darkMode
                        ? 'bg-slate-800/50 border-slate-700'
                        : 'bg-slate-50 border-slate-200'
                    }`}
                  >
                    <div className="text-slate-400">Записи в очередях на лабы:</div>
                    <div className="font-bold text-sm mt-0.5">
                      {studentQueues.length} активн.
                    </div>
                  </div>
                  <div
                    className={`p-3 rounded-xl border ${
                      darkMode
                        ? 'bg-slate-800/50 border-slate-700'
                        : 'bg-slate-50 border-slate-200'
                    }`}
                  >
                    <div className="text-slate-400">Сдано сборов в фонд:</div>
                    <div className="font-bold text-sm mt-0.5">
                      {studentPaidFunds.length} из {funds.length}
                    </div>
                  </div>
                </div>

                {/* Footer with Delete button for Starosta */}
                <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                  {currentUser.role === 'starosta' && student.role !== 'starosta' ? (
                    <button
                      type="button"
                      onClick={() => deleteMemberByStarosta(student.id)}
                      className="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold flex items-center gap-1.5"
                    >
                      <Trash2 className="w-4 h-4" />
                      {student.role === 'deputy'
                        ? 'Удалить заместителя старосты из группы'
                        : 'Удалить студента из группы'}
                    </button>
                  ) : (
                    <span className="text-[11px] text-slate-400">
                      Удалять участников из группы может только староста
                    </span>
                  )}

                  <button
                    type="button"
                    onClick={() => setSelectedStudentProfileId(null)}
                    className="px-4 py-2 rounded-xl bg-[#2688EB] text-white text-xs font-bold"
                  >
                    Закрыть карточку
                  </button>
                </div>
              </div>
            </div>
          );
        })()}

      {/* Toast Notification */}
      {toastMessage && (
        <div className="fixed bottom-4 right-4 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg border border-slate-700 text-xs sm:text-sm font-medium flex items-center gap-2">
          <Check className="w-4 h-4 text-emerald-400" />
          <span>{toastMessage}</span>
        </div>
      )}
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  
  </script>
</body>
</html>
