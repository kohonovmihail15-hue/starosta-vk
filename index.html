<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Староста.ВК — VK Mini App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.14"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  
  <!-- VK Bridge (Official VK CDN / jsDelivr, 100% working in RU) -->
  <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.15.1/dist/browser.min.js"></script>
  
  <!-- React & ReactDOM (Cloudflare cdnjs, rock-solid, no unpkg) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (Cloudflare cdnjs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
  
  <script>
    window.addEventListener('error', function(e) {
      console.error('App load error:', e);
      var errEl = document.getElementById('debug-error');
      if (errEl) {
        errEl.style.display = 'block';
        errEl.innerText = 'Ошибка загрузки: ' + (e.message || e.toString());
      }
    });
    if (window.vkBridge) {
      window.vkBridge.send('VKWebAppInit').catch(function() {});
    }
  </script>
</head>
<body class="bg-[#EBEDF0] text-slate-900 antialiased selection:bg-[#2688EB] selection:text-white">
  <div id="root">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl border border-slate-200 p-8 max-w-sm w-full text-center shadow-sm">
        <div class="w-12 h-12 border-4 border-[#2688EB] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <div class="font-bold text-base text-slate-900">Загрузка Староста.ВК...</div>
        <div class="text-xs text-slate-500 mt-1">Подключение к интерфейсу группы</div>
        <div id="debug-error" style="display:none;" class="mt-4 p-3 rounded-xl bg-rose-50 text-rose-600 text-xs text-left font-mono"></div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    // ============================================================================
    // 🔑 ГЛАВНАЯ НАСТРОЙКА БОТА ВК (В КОРНЕ ФАЙЛА НА GITHUB):
    // Вставьте сюда ключ доступа (токен) вашего сообщества ВКонтакте.
    // Один этот бот обслуживает ВСЕ созданные учебные группы и сам определяет,
    // к какому сообществу он подключен и участникам какой именно группы слать сообщения.
    // ============================================================================
    const VK_BOT_TOKEN = "ВСТАВЬТЕ_СЮДА_ТОКЕН_СООБЩЕСТВА_ВК";
    const VK_MINI_APP_ID = 54871400;
    // АДРЕС ПРОКСИ-СЕРВЕРА (рекомендуется, см. server/proxy.js и README).
    // Если указан — токен сообщества хранится только на сервере, а не в браузере.
    // Если пуст — используется старый режим с токеном в этом файле (ТОЛЬКО для тестов!).
    // 🐍 АДРЕС PYTHON-СЕРВЕРА С БАЗОЙ SQLITE (server.py):
    // Если вы запустили `python server.py` на компьютере (порт 8000) или открыли http://127.0.0.1:8000,
    // приложение подключится к Python-базе starosta.db АВТОМАТИЧЕСКИ!
    // Если сервер выложен в интернет (VPS / CloudPub / ngrok), можно указать его HTTPS-адрес ниже:
    const PYTHON_SERVER_URL = "";
    const VK_PROXY_URL = "";

    const { useState, useMemo, useEffect, useRef } = React;

    // Вызов методов VK API через JSONP (работает напрямую из браузера в РФ без VPN)
    const callVkApiDirect = (method, params = {}) => {
      return new Promise((resolve) => {
        const token = (params.access_token || VK_BOT_TOKEN || '').trim();
        if (!token || token === 'ВСТАВЬТЕ_СЮДА_ТОКЕН_СООБЩЕСТВА_ВК') {
          resolve({ error: { error_msg: 'No token' } });
          return;
        }
        const cbName = 'vk_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        const timer = setTimeout(() => {
          if (window[cbName]) delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve({ error: { error_msg: 'Timeout' } });
        }, 7000);

        window[cbName] = (data) => {
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data || {});
        };

        const query = new URLSearchParams({
          ...params,
          access_token: token,
          v: '5.199',
          callback: cbName,
        });
        script.src = `https://api.vk.com/method/${method}?${query.toString()}`;
        script.onerror = () => {
          clearTimeout(timer);
          if (window[cbName]) delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve({ error: { error_msg: 'Network error' } });
        };
        document.body.appendChild(script);
      });
    };

    const callVkApiViaProxy = async (method, params = {}) => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      try {
        const r = await fetch(VK_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            method,
            params,
            launchParams: window.location.search.replace(/^\?/, ''),
          }),
          signal: ctrl.signal,
        });
        return (await r.json()) || {};
      } catch {
        return { error: { error_msg: 'Network error' } };
      } finally {
        clearTimeout(timer);
      }
    };

    let tokenWarned = false;
    const callVkApi = (method, params = {}) => {
      if (VK_PROXY_URL) return callVkApiViaProxy(method, params);
      if (!tokenWarned) {
        tokenWarned = true;
        console.warn('[Староста.ВК] Токен сообщества используется в браузере — это небезопасно. Настройте VK_PROXY_URL.');
      }
      return callVkApiDirect(method, params);
    };

    // Получение VK ID текущего пользователя из параметров запуска ВК
    const getLaunchVkUserId = () => {
      try {
        const searchParams = new URLSearchParams(window.location.search);
        const fromSearch = searchParams.get('vk_user_id');
        if (fromSearch) return String(fromSearch);
        const hash = window.location.hash || '';
        if (hash.includes('vk_user_id=')) {
          return hash.split('vk_user_id=')[1].split('&')[0];
        }
      } catch {
        // Ignore
      }
      return '';
    };

    // 🧹 АВТОМАТИЧЕСКАЯ ОЧИСТКА ВСЕХ СТАРЫХ БАЗ И КЭША НА УСТРОЙСТВАХ
    const LEGACY_STORAGE_KEYS = [
      'starosta_vk_production_v1',
      'starosta_vk_production_v2',
      'starosta_vk_production_v3',
      'starosta_vk_production_v4',
      'starosta_vk_groups_registry_v1',
      'starosta_vk_groups_registry_v2',
      'starosta_vk_groups_registry_v3',
      'starosta_vk_cloud_pointers_v1',
      'starosta_vk_cloud_pointers_v2',
      'starosta_vk_state',
      'starosta_vk_data',
    ];
    try {
      LEGACY_STORAGE_KEYS.forEach((k) => localStorage.removeItem(k));
    } catch {
      // Ignore
    }

    const REGISTRY_STORAGE_KEY = 'starosta_vk_groups_registry_clean_v5';
    const POINTERS_KEY = 'starosta_vk_cloud_pointers_clean_v5';
    const VK_MESSAGE_LIMIT = 4000;
    const NTFY_BASE_URL = 'https://ntfy.sh';
    const JSONBLOB_API_URL = 'https://jsonblob.com/api/jsonBlob';
    let syncErrorHandler = null;
    let detectedPythonBaseUrl = null;

    // Автоматическое определение работающего Python-сервера (server.py)
    const getPythonServerBaseUrl = async () => {
      if (PYTHON_SERVER_URL && PYTHON_SERVER_URL.trim()) {
        return PYTHON_SERVER_URL.trim().replace(/\/+$/, '');
      }
      if (detectedPythonBaseUrl !== null) {
        return detectedPythonBaseUrl;
      }
      const candidates = [];
      try {
        if (
          window.location.origin &&
          window.location.origin.startsWith('http') &&
          !window.location.origin.includes('github.io') &&
          !window.location.origin.includes('vk.com')
        ) {
          candidates.push(window.location.origin);
        }
      } catch {
        // Ignore
      }
      candidates.push('http://127.0.0.1:8000', 'http://localhost:8000');

      for (const base of candidates) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 1200);
        try {
          const r = await fetch(`${base}/api/health`, {
            method: 'GET',
            signal: ctrl.signal,
          });
          if (r.ok) {
            const d = await r.json();
            if (d && d.ok) {
              detectedPythonBaseUrl = base;
              return base;
            }
          }
        } catch {
          // Try next candidate
        } finally {
          clearTimeout(t);
        }
      }
      detectedPythonBaseUrl = '';
      return '';
    };

    const callPythonApi = async (path, method = 'GET', bodyObj = null) => {
      const base = await getPythonServerBaseUrl();
      if (!base) return null;
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 4500);
      try {
        const opts = {
          method,
          headers: { Accept: 'application/json' },
          signal: ctrl.signal,
        };
        if (bodyObj !== null) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(bodyObj);
        }
        const r = await fetch(`${base}${path}`, opts);
        const data = await r.json();
        return { status: r.status, ok: r.ok, data };
      } catch {
        return null;
      } finally {
        clearTimeout(t);
      }
    };

    // Канал мгновенной синхронизации между вкладками одного браузера
    const localBroadcastChannel = (() => {
      try {
        return typeof BroadcastChannel !== 'undefined'
          ? new BroadcastChannel('starosta_vk_realtime_sync_v4')
          : null;
      } catch {
        return null;
      }
    })();

    // Детерминированное хеширование строк (включая кириллицу) для облачных ключей
    const hashStringHex = (str) => {
      const s = String(str || '').trim().toUpperCase();
      let h1 = 0xdeadbeef ^ s.length;
      let h2 = 0x41c6ce57 ^ s.length;
      for (let i = 0; i < s.length; i++) {
        const ch = s.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 =
        Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^
        Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 =
        Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^
        Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (
        (h1 >>> 0).toString(16).padStart(8, '0') +
        (h2 >>> 0).toString(16).padStart(8, '0')
      );
    };

    const normalizeCodeKey = (raw) =>
      String(raw || '')
        .trim()
        .toUpperCase()
        .replace(/[—–−]/g, '-')
        .replace(/\s+/g, '');

    const normalizeGroupNameKey = (raw) =>
      String(raw || '')
        .trim()
        .toUpperCase()
        .replace(/[^A-ZА-ЯЁ0-9]/gi, '');

    // Извлечение кода группы и seed из произвольного текста (если студент вставил ссылку или всё сообщение)
    const extractCodeAndSeedFromInput = (rawInput) => {
      const text = String(rawInput || '').trim();
      let seedObj = null;
      if (text.includes('seed=')) {
        const seedPart = text.split('seed=')[1]?.split(/[&#\s]/)[0];
        if (seedPart) {
          seedObj = decodeGroupSeed(seedPart);
        }
      }
      if (text.includes('join=')) {
        const joinPart = text.split('join=')[1]?.split(/[&#\s]/)[0];
        if (joinPart) {
          return {
            code: normalizeCodeKey(decodeURIComponent(joinPart)),
            seed: seedObj,
          };
        }
      }
      const vkCodeMatch = text.match(/VK-[A-ZА-ЯЁ0-9]+-\d{4}/i);
      if (vkCodeMatch) {
        return { code: normalizeCodeKey(vkCodeMatch[0]), seed: seedObj };
      }
      return { code: normalizeCodeKey(text), seed: seedObj };
    };

    const toCloudTopic = (kind, rawKey) => {
      const norm =
        kind === 'name'
          ? normalizeGroupNameKey(rawKey)
          : normalizeCodeKey(rawKey);
      const asciiPart =
        norm.replace(/[^A-Z0-9]/g, '').slice(0, 10).toLowerCase() || 'grp';
      const hash = hashStringHex(`${kind}:${norm}`);
      return `stvk5_${VK_MINI_APP_ID}_${kind}_${asciiPart}_${hash}`;
    };

    const GLOBAL_DIRECTORY_TOPIC = `stvk5_${VK_MINI_APP_ID}_dir_clean_v5`;

    // Кодирование и декодирование компактного снимка группы для ссылки приглашения
    const encodeGroupSeed = (payload) => {
      try {
        if (!payload || !payload.groupInfo) return '';
        const minimal = {
          c: payload.groupInfo.code,
          n: payload.groupInfo.name,
          u: payload.groupInfo.university,
          f: payload.groupInfo.faculty,
          k: payload.groupInfo.course,
          b: payload.cloudBlobId || '',
          w: payload.weekAnchor || null,
          m: (payload.members || []).slice(0, 12).map((m) => ({
            i: m.id,
            v: m.vkId || '',
            n: m.name,
            t: m.vkTag || '',
            s: m.subgroup || 1,
            r: m.role || 'member',
          })),
        };
        const json = JSON.stringify(minimal);
        return btoa(unescape(encodeURIComponent(json)))
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
      } catch {
        return '';
      }
    };

    const decodeGroupSeed = (seedStr) => {
      try {
        if (!seedStr) return null;
        let b64 = String(seedStr).replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const json = decodeURIComponent(escape(atob(b64)));
        const d = JSON.parse(json);
        if (!d || !d.c || !d.n) return null;
        const code = normalizeCodeKey(d.c);
        return {
          cloudBlobId: d.b || '',
          groupInfo: {
            code,
            name: d.n,
            university: d.u || 'ВУЗ',
            faculty: d.f || 'Факультет не указан',
            course: d.k || '1 курс',
            inviteLink: `https://vk.com/app${VK_MINI_APP_ID}#join=${code}`,
          },
          weekAnchor: d.w || null,
          members: Array.isArray(d.m)
            ? d.m.map((x) => ({
                id: x.i || 'u1',
                vkId: x.v || '',
                groupCode: code,
                name: x.n || 'Участник',
                vkTag: x.t || '',
                subgroup: Number(x.s) || 1,
                role: x.r || 'member',
                avatarColor:
                  x.r === 'starosta'
                    ? 'bg-blue-600'
                    : x.r === 'deputy'
                    ? 'bg-purple-600'
                    : 'bg-emerald-600',
                permissions:
                  x.r === 'starosta' || x.r === 'deputy'
                    ? {
                        canManageHomework: true,
                        canMarkAttendance: true,
                        canEditSchedule: true,
                        canManageQueues: true,
                        canPostAnnouncements: true,
                      }
                    : {
                        canManageHomework: false,
                        canMarkAttendance: false,
                        canEditSchedule: false,
                        canManageQueues: false,
                        canPostAnnouncements: false,
                      },
              }))
            : [],
          schedule: [],
          homeworks: [],
          queues: [],
          funds: [],
          botBroadcasts: [],
          attendance: {},
          deleteConfirmations: { starosta: false, deputy: false },
          deletedIds: { members: {}, schedule: {}, homeworks: {}, queues: {}, funds: {} },
          updatedAt: 1,
        };
      } catch {
        return null;
      }
    };

    const getLocalGroupsRegistry = () => {
      try {
        const raw = localStorage.getItem(REGISTRY_STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch {
        return {};
      }
    };

    const setLocalGroupInRegistry = (code, groupPayload) => {
      try {
        const clean = normalizeCodeKey(code);
        if (!clean) return;
        const reg = getLocalGroupsRegistry();
        reg[clean] = groupPayload;
        localStorage.setItem(REGISTRY_STORAGE_KEY, JSON.stringify(reg));
      } catch {
        // Ignore
      }
    };

    const removeLocalGroupFromRegistry = (code) => {
      try {
        const clean = normalizeCodeKey(code);
        const reg = getLocalGroupsRegistry();
        delete reg[clean];
        localStorage.setItem(REGISTRY_STORAGE_KEY, JSON.stringify(reg));
      } catch {
        // Ignore
      }
    };

    const parseGroupMessageText = (text, code) => {
      if (!text) return null;
      const marker = `[GROUP_DB:${normalizeCodeKey(code)}]`;
      const idx = text.indexOf(marker);
      if (idx === -1) return null;
      const jsonStr = text.slice(idx + marker.length).trim();
      try {
        return JSON.parse(jsonStr);
      } catch {
        return null;
      }
    };

    const getPointers = () => {
      try {
        return JSON.parse(localStorage.getItem(POINTERS_KEY) || '{}');
      } catch {
        return {};
      }
    };

    const setPointer = (code, ptr) => {
      try {
        const clean = normalizeCodeKey(code);
        const all = getPointers();
        if (ptr) all[clean] = { ...(all[clean] || {}), ...ptr };
        else delete all[clean];
        localStorage.setItem(POINTERS_KEY, JSON.stringify(all));
      } catch {
        // Ignore
      }
    };

    const extractMessageId = (res) => {
      const r = res?.response;
      if (typeof r === 'number') return r;
      if (Array.isArray(r)) return r[0]?.message_id || null;
      if (r && typeof r === 'object') return r.message_id || null;
      return null;
    };

    // Умное слияние данных группы с разных устройств (без потери участников, расписания и ДЗ)
    const mergeGroupPayloads = (baseRaw, incomingRaw) => {
      if (!baseRaw || !baseRaw.groupInfo) return incomingRaw;
      if (!incomingRaw || !incomingRaw.groupInfo) return baseRaw;
      if (baseRaw.deleted || incomingRaw.deleted) {
        return { deleted: true, deletedAt: Math.max(baseRaw.deletedAt || 0, incomingRaw.deletedAt || 0) };
      }

      const baseTs = Number(baseRaw.updatedAt || 0);
      const incTs = Number(incomingRaw.updatedAt || 0);
      const newer = incTs >= baseTs ? incomingRaw : baseRaw;
      const older = incTs >= baseTs ? baseRaw : incomingRaw;

      const deletedIds = {
        members: { ...(older.deletedIds?.members || {}), ...(newer.deletedIds?.members || {}) },
        schedule: { ...(older.deletedIds?.schedule || {}), ...(newer.deletedIds?.schedule || {}) },
        homeworks: { ...(older.deletedIds?.homeworks || {}), ...(newer.deletedIds?.homeworks || {}) },
        queues: { ...(older.deletedIds?.queues || {}), ...(newer.deletedIds?.queues || {}) },
        funds: { ...(older.deletedIds?.funds || {}), ...(newer.deletedIds?.funds || {}) },
      };

      // Слияние участников (без дублей и с сохранением всех вступивших студентов)
      const memberMap = new Map();
      const ingestMember = (m) => {
        if (!m || !m.id) return;
        const delTs = deletedIds.members[m.id];
        if (delTs && (!m.joinedAt || m.joinedAt <= delTs)) return;

        // Ищем совпадение по id, по vkId или по роли старосты (u1)
        let matchKey = m.id;
        for (const [k, existing] of memberMap.entries()) {
          if (k === m.id) {
            matchKey = k;
            break;
          }
          if (m.vkId && existing.vkId && String(m.vkId) === String(existing.vkId)) {
            matchKey = k;
            break;
          }
          if (m.role === 'starosta' && existing.role === 'starosta') {
            matchKey = k;
            break;
          }
        }

        const prev = memberMap.get(matchKey);
        if (!prev) {
          memberMap.set(matchKey, { ...m, id: matchKey });
        } else {
          const prevIsPlaceholder =
            !prev.name ||
            prev.name === 'Староста группы' ||
            prev.name === 'Староста' ||
            prev.name === 'Пользователь';
          const curIsPlaceholder =
            !m.name ||
            m.name === 'Староста группы' ||
            m.name === 'Староста' ||
            m.name === 'Пользователь';

          const pickCur =
            (prevIsPlaceholder && !curIsPlaceholder) ||
            (!curIsPlaceholder && (m.updatedAt || incTs) >= (prev.updatedAt || baseTs));

          const chosen = pickCur ? { ...prev, ...m, id: matchKey } : { ...m, ...prev, id: matchKey };
          chosen.vkId = m.vkId || prev.vkId || '';
          chosen.vkTag =
            m.vkTag && m.vkTag !== '@starosta' && m.vkTag !== '@vk_student'
              ? m.vkTag
              : prev.vkTag || m.vkTag || '';
          memberMap.set(matchKey, chosen);
        }
      };

      (older.members || []).forEach(ingestMember);
      (newer.members || []).forEach(ingestMember);
      const mergedMembers = Array.from(memberMap.values());

      // Слияние коллекций по id
      const mergeById = (arrOld = [], arrNew = [], delMap = {}, customMerge = null) => {
        const map = new Map();
        arrOld.forEach((item) => {
          if (item && item.id && !delMap[item.id]) map.set(item.id, item);
        });
        arrNew.forEach((item) => {
          if (!item || !item.id || delMap[item.id]) return;
          const prev = map.get(item.id);
          if (!prev) {
            map.set(item.id, item);
          } else if (customMerge) {
            map.set(item.id, customMerge(prev, item));
          } else {
            map.set(item.id, { ...prev, ...item });
          }
        });
        return Array.from(map.values());
      };

      const mergedSchedule = mergeById(older.schedule, newer.schedule, deletedIds.schedule);
      const mergedHomeworks = mergeById(
        older.homeworks,
        newer.homeworks,
        deletedIds.homeworks,
        (a, b) => ({
          ...a,
          ...b,
          completedBy: Array.from(new Set([...(a.completedBy || []), ...(b.completedBy || [])])),
        })
      );
      const mergedQueues = mergeById(
        older.queues,
        newer.queues,
        deletedIds.queues,
        (a, b) => {
          const entryMap = new Map();
          (a.entries || []).forEach((e) => e?.userId && entryMap.set(e.userId, e));
          (b.entries || []).forEach((e) => e?.userId && entryMap.set(e.userId, e));
          return { ...a, ...b, entries: Array.from(entryMap.values()) };
        }
      );
      const mergedFunds = mergeById(
        older.funds,
        newer.funds,
        deletedIds.funds,
        (a, b) => ({
          ...a,
          ...b,
          paidIds: Array.from(new Set([...(a.paidIds || []), ...(b.paidIds || [])])),
        })
      );
      const mergedBroadcasts = mergeById(older.botBroadcasts, newer.botBroadcasts, {});

      // Слияние подтверждений удаления по временным меткам каждой роли
      const oldDel = older.deleteConfirmations || { starosta: false, deputy: false };
      const newDel = newer.deleteConfirmations || { starosta: false, deputy: false };
      const starostaDelTs = Math.max(oldDel.starostaTs || 0, newDel.starostaTs || 0);
      const deputyDelTs = Math.max(oldDel.deputyTs || 0, newDel.deputyTs || 0);
      const mergedDeleteConfirmations = {
        starosta:
          (newDel.starostaTs || 0) >= (oldDel.starostaTs || 0)
            ? Boolean(newDel.starosta)
            : Boolean(oldDel.starosta),
        deputy:
          (newDel.deputyTs || 0) >= (oldDel.deputyTs || 0)
            ? Boolean(newDel.deputy)
            : Boolean(oldDel.deputy),
        starostaTs: starostaDelTs,
        deputyTs: deputyDelTs,
      };

      const cloudBlobId = newer.cloudBlobId || older.cloudBlobId || '';
      const mergedGroupInfo = {
        ...older.groupInfo,
        ...newer.groupInfo,
      };
      const mergedPayload = {
        ...older,
        ...newer,
        cloudBlobId,
        groupInfo: mergedGroupInfo,
        members: mergedMembers,
        schedule: mergedSchedule,
        homeworks: mergedHomeworks,
        queues: mergedQueues,
        funds: mergedFunds,
        botBroadcasts: mergedBroadcasts,
        attendance: { ...(older.attendance || {}), ...(newer.attendance || {}) },
        dailyDeputyByDay: { ...(older.dailyDeputyByDay || {}), ...(newer.dailyDeputyByDay || {}) },
        dailyAbsenceReasonByDay: {
          ...(older.dailyAbsenceReasonByDay || {}),
          ...(newer.dailyAbsenceReasonByDay || {}),
        },
        dailyDeputyPermissions: {
          ...(older.dailyDeputyPermissions || {}),
          ...(newer.dailyDeputyPermissions || {}),
        },
        deleteConfirmations: mergedDeleteConfirmations,
        deletedIds,
        weekAnchor: newer.weekAnchor || older.weekAnchor,
        updatedAt: Math.max(baseTs, incTs, Date.now()),
      };

      const seed = encodeGroupSeed(mergedPayload);
      if (seed && mergedPayload.groupInfo?.code) {
        mergedPayload.groupInfo.inviteLink = `https://vk.com/app${VK_MINI_APP_ID}#join=${mergedPayload.groupInfo.code}&seed=${seed}`;
      }
      return mergedPayload;
    };

    // Работа с облачным JSON-хранилищем (JSONBlob + ntfy.sh) — работает без токена ВК на всех устройствах
    const fetchJsonBlobById = async (blobId) => {
      if (!blobId) return null;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5500);
      try {
        const res = await fetch(`${JSONBLOB_API_URL}/${blobId}`, {
          method: 'GET',
          headers: { Accept: 'application/json' },
          signal: ctrl.signal,
        });
        if (!res.ok) return null;
        return await res.json();
      } catch {
        return null;
      } finally {
        clearTimeout(timer);
      }
    };

    const saveToJsonBlob = async (blobId, payload) => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      try {
        if (blobId) {
          const putRes = await fetch(`${JSONBLOB_API_URL}/${blobId}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json',
            },
            body: JSON.stringify(payload),
            signal: ctrl.signal,
          });
          if (putRes.ok) return blobId;
        }
        const postRes = await fetch(JSONBLOB_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json',
          },
          body: JSON.stringify(payload),
          signal: ctrl.signal,
        });
        if (!postRes.ok) return blobId || '';
        const loc =
          postRes.headers.get('Location') ||
          postRes.headers.get('location') ||
          postRes.headers.get('X-jsonblob') ||
          postRes.headers.get('x-jsonblob-id') ||
          '';
        const match = String(loc).match(/([a-zA-Z0-9-]{10,})$/);
        return match ? match[1] : blobId || '';
      } catch {
        return blobId || '';
      } finally {
        clearTimeout(timer);
      }
    };

    // Чтение последних записей из облачного канала ntfy.sh
    const readNtfyTopicMessages = async (topic) => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5500);
      try {
        const res = await fetch(`${NTFY_BASE_URL}/${topic}/json?poll=1&since=all`, {
          method: 'GET',
          signal: ctrl.signal,
        });
        if (!res.ok) return [];
        const text = await res.text();
        const lines = text.split('\n').filter((l) => l.trim());
        const parsedMsgs = [];
        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const evt = JSON.parse(lines[i]);
            if (evt && evt.event === 'message' && evt.message) {
              const body = JSON.parse(evt.message);
              if (body) parsedMsgs.push(body);
            }
          } catch {
            // Ignore malformed line
          }
        }
        return parsedMsgs;
      } catch {
        return [];
      } finally {
        clearTimeout(timer);
      }
    };

    // Публикация компактного состояния группы в облачный канал ntfy.sh (< 3700 байт)
    const publishToNtfyTopic = async (topic, payloadObj) => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5500);
      try {
        let bodyStr = JSON.stringify(payloadObj);
        if (bodyStr.length > 3700 && payloadObj.groupInfo) {
          // Ужимаем второстепенные поля, сохраняя участников и указатель на полный JSONBlob
          const slim = {
            cloudBlobId: payloadObj.cloudBlobId || '',
            groupInfo: payloadObj.groupInfo,
            weekAnchor: payloadObj.weekAnchor,
            members: payloadObj.members || [],
            schedule: (payloadObj.schedule || []).slice(0, 24),
            homeworks: (payloadObj.homeworks || []).slice(0, 20),
            deleteConfirmations: payloadObj.deleteConfirmations,
            deletedIds: payloadObj.deletedIds,
            updatedAt: payloadObj.updatedAt || Date.now(),
          };
          bodyStr = JSON.stringify(slim);
        }
        const res = await fetch(`${NTFY_BASE_URL}/${topic}`, {
          method: 'POST',
          body: bodyStr,
          signal: ctrl.signal,
        });
        return res.ok;
      } catch {
        return false;
      } finally {
        clearTimeout(timer);
      }
    };

    // Загрузка списка всех созданных групп из базы Python SQLite (server.py) + облачного каталога
    const fetchCloudGroupsDirectory = async () => {
      const pyRes = await callPythonApi('/api/groups', 'GET');
      const pyGroups =
        pyRes && pyRes.ok && Array.isArray(pyRes.data?.groups)
          ? pyRes.data.groups
          : [];
      const items = [...pyGroups, ...(await readNtfyTopicMessages(GLOBAL_DIRECTORY_TOPIC))];
      const map = new Map();
      const deletedCodes = new Set();
      for (const item of items) {
        const code = normalizeCodeKey(item?.code || item?.groupInfo?.code);
        if (!code) continue;
        if (item.deleted) {
          deletedCodes.add(code);
          continue;
        }
        if (deletedCodes.has(code)) continue;
        if (!map.has(code)) {
          map.set(code, {
            code,
            name: item.name || item.groupInfo?.name || code,
            university: item.university || item.groupInfo?.university || '',
            course: item.course || item.groupInfo?.course || '',
            cloudBlobId: item.cloudBlobId || '',
            membersCount: item.membersCount || (item.members ? item.members.length : 1),
            updatedAt: item.updatedAt || 0,
          });
        }
      }
      // Добавляем локальные группы
      const localReg = getLocalGroupsRegistry();
      Object.values(localReg).forEach((g) => {
        const c = normalizeCodeKey(g?.groupInfo?.code);
        if (c && !g.deleted && !deletedCodes.has(c) && !map.has(c)) {
          map.set(c, {
            code: c,
            name: g.groupInfo.name,
            university: g.groupInfo.university,
            course: g.groupInfo.course,
            cloudBlobId: g.cloudBlobId || '',
            membersCount: (g.members || []).length || 1,
            updatedAt: g.updatedAt || 0,
          });
        }
      });
      return Array.from(map.values());
    };

    // Поиск группы по коду, названию группы или ссылке приглашения в Python SQLite (server.py) и облаке
    const fetchGroupByCode = async (rawInput, options = {}) => {
      const { code: extractedCode, seed: seedFromInput } = extractCodeAndSeedFromInput(rawInput);
      const code = extractedCode;
      if (!code && !seedFromInput) return null;

      let candidates = [];
      if (seedFromInput && seedFromInput.groupInfo) {
        candidates.push(seedFromInput);
      }

      // 0. Приоритетный запрос к Python SQLite серверу (server.py), если он запущен
      const pyRes = await callPythonApi(
        `/api/group?query=${encodeURIComponent(rawInput || code)}`,
        'GET'
      );
      if (pyRes && pyRes.data) {
        if (pyRes.data.deleted) {
          return { deleted: true, source: 'python_sqlite' };
        }
        if (pyRes.data.ok && pyRes.data.data?.groupInfo) {
          candidates.push(pyRes.data.data);
        }
      }

      const ptr = getPointers()[code] || {};
      const knownBlobId = ptr.cloudBlobId || seedFromInput?.cloudBlobId || '';

      // 1. Запрос к облачным каналам (ntfy по коду, ntfy по названию группы, JSONBlob) параллельно
      const codeTopic = toCloudTopic('code', code);
      const nameTopic = toCloudTopic('name', rawInput);

      const [codeMsgs, nameMsgs, directBlob] = await Promise.all([
        readNtfyTopicMessages(codeTopic),
        normNameNeedsSearch(code, rawInput) ? readNtfyTopicMessages(nameTopic) : Promise.resolve([]),
        knownBlobId ? fetchJsonBlobById(knownBlobId) : Promise.resolve(null),
      ]);

      if (directBlob) {
        if (directBlob.deleted) return { deleted: true, source: 'cloud' };
        if (directBlob.groupInfo) candidates.push(directBlob);
      }

      const allNtfyMsgs = [...codeMsgs, ...nameMsgs];
      let discoveredBlobId = knownBlobId;

      for (const msg of allNtfyMsgs) {
        if (!msg) continue;
        if (msg.deleted) {
          return { deleted: true, source: 'cloud' };
        }
        if (msg.cloudBlobId && !discoveredBlobId) {
          discoveredBlobId = msg.cloudBlobId;
        }
        if (msg.groupInfo) {
          candidates.push(msg);
        }
      }

      // Если в сообщении ntfy нашли ссылку на полный JSONBlob, который ещё не загружали — подгружаем его
      if (discoveredBlobId && discoveredBlobId !== knownBlobId) {
        const blobData = await fetchJsonBlobById(discoveredBlobId);
        if (blobData) {
          if (blobData.deleted) return { deleted: true, source: 'cloud' };
          if (blobData.groupInfo) candidates.push(blobData);
        }
      }

      // 2. Если не нашли напрямую — проверяем глобальный облачный каталог групп (по части кода или названию)
      if (candidates.length === 0 && !options.skipDirectorySearch) {
        const dirList = await fetchCloudGroupsDirectory();
        const normInputName = normalizeGroupNameKey(rawInput);
        const matchedDir = dirList.find(
          (item) =>
            item.code === code ||
            item.code.endsWith('-' + code) ||
            (normInputName && normalizeGroupNameKey(item.name) === normInputName)
        );
        if (matchedDir && matchedDir.code !== code) {
          const byMatchedCode = await fetchGroupByCode(matchedDir.code, {
            ...options,
            skipDirectorySearch: true,
          });
          if (byMatchedCode) return byMatchedCode;
        } else if (matchedDir?.cloudBlobId) {
          const blobData = await fetchJsonBlobById(matchedDir.cloudBlobId);
          if (blobData?.groupInfo) candidates.push(blobData);
        }
      }

      // 3. Дополнительная проверка через VK API (если настроен VK_BOT_TOKEN или VK_PROXY_URL)
      if (ptr?.msgId) {
        const byId = await callVkApi('messages.getById', {
          message_ids: String(ptr.msgId),
        });
        const item = byId?.response?.items?.[0];
        const parsed = parseGroupMessageText(item?.text, code);
        if (parsed) {
          if (parsed.deleted) return { deleted: true, msgId: item.id, peerId: item.peer_id };
          if (parsed.groupInfo) candidates.push(parsed);
        }
      } else {
        const searchRes = await callVkApi('messages.search', {
          q: `[GROUP_DB:${code}]`,
          count: 5,
        });
        if (searchRes?.response?.items?.length > 0) {
          for (const item of searchRes.response.items) {
            const parsed = parseGroupMessageText(item.text, code);
            if (parsed) {
              if (parsed.deleted) return { deleted: true, msgId: item.id, peerId: item.peer_id };
              if (parsed.groupInfo) {
                setPointer(code, { msgId: item.id, peerId: item.peer_id });
                candidates.push(parsed);
                break;
              }
            }
          }
        }
      }

      // 4. Подмешиваем локальный реестр для полноты слияния
      const localReg = getLocalGroupsRegistry();
      const normInputName = normalizeGroupNameKey(rawInput);
      const localMatch =
        localReg[code] ||
        Object.values(localReg).find(
          (g) =>
            g?.groupInfo &&
            !g.deleted &&
            (normalizeCodeKey(g.groupInfo.code) === code ||
              (normInputName && normalizeGroupNameKey(g.groupInfo.name) === normInputName))
        );

      if (!options.skipLocal && localMatch && !localMatch.deleted) {
        candidates.push(localMatch);
      }

      if (candidates.length === 0) {
        return null;
      }

      // Сливаем все найденные версии группы в единое актуальное состояние
      let merged = candidates[0];
      for (let i = 1; i < candidates.length; i++) {
        merged = mergeGroupPayloads(merged, candidates[i]);
      }

      const finalCode = normalizeCodeKey(merged.groupInfo?.code || code);
      setLocalGroupInRegistry(finalCode, merged);
      if (merged.cloudBlobId) {
        setPointer(finalCode, { cloudBlobId: merged.cloudBlobId });
      }

      return {
        data: merged,
        cloudBlobId: merged.cloudBlobId || '',
        source: candidates.length > (localMatch ? 1 : 0) ? 'cloud' : 'local',
      };
    };

    function normNameNeedsSearch(code, rawInput) {
      const n = normalizeGroupNameKey(rawInput);
      return Boolean(n && !String(code).startsWith('VK-'));
    }

    // Сохранение и синхронизация группы в базу Python SQLite (server.py) и облачные каналы
    const saveGroupByCode = async (rawCode, groupPayload, preferredPeerId = '', options = {}) => {
      const code = normalizeCodeKey(rawCode || groupPayload?.groupInfo?.code);
      if (!code) return null;

      // 0. Синхронизация с Python SQLite сервером (server.py), если он запущен
      const pySync = await callPythonApi('/api/group/sync', 'POST', {
        code,
        payload: groupPayload,
      });
      if (pySync && pySync.data) {
        if (pySync.data.deleted) {
          removeLocalGroupFromRegistry(code);
          return { deleted: true, code };
        }
        if (pySync.data.ok && pySync.data.data?.groupInfo) {
          groupPayload = pySync.data.data;
        }
      }

      // Обработка полного удаления группы
      if (groupPayload?.deleted) {
        const delObj = {
          deleted: true,
          code,
          deletedAt: Date.now(),
        };
        removeLocalGroupFromRegistry(code);
        const ptr = getPointers()[code];
        await Promise.all([
          publishToNtfyTopic(toCloudTopic('code', code), delObj),
          groupPayload.groupName
            ? publishToNtfyTopic(toCloudTopic('name', groupPayload.groupName), delObj)
            : Promise.resolve(true),
          publishToNtfyTopic(GLOBAL_DIRECTORY_TOPIC, delObj),
          ptr?.cloudBlobId ? saveToJsonBlob(ptr.cloudBlobId, delObj) : Promise.resolve(''),
        ]);
        if (localBroadcastChannel) {
          try {
            localBroadcastChannel.postMessage({ type: 'GROUP_DELETED', code });
          } catch {
            // Ignore
          }
        }
        return delObj;
      }

      // 1. Сначала подгружаем свежую облачную версию, чтобы не затереть новых участников
      let mergedPayload = { ...groupPayload, updatedAt: Date.now() };
      if (!options.skipRemoteMerge) {
        const existingCloud = await fetchGroupByCode(code, {
          skipLocal: true,
          skipDirectorySearch: true,
        });
        if (existingCloud?.data?.groupInfo) {
          mergedPayload = mergeGroupPayloads(existingCloud.data, mergedPayload);
        }
      }

      const ptr = getPointers()[code] || {};
      const existingBlobId = mergedPayload.cloudBlobId || ptr.cloudBlobId || '';

      // 2. Сохраняем полный JSON в JSONBlob (без лимита на размер)
      const savedBlobId = await saveToJsonBlob(existingBlobId, mergedPayload);
      if (savedBlobId) {
        mergedPayload.cloudBlobId = savedBlobId;
        setPointer(code, { cloudBlobId: savedBlobId });
      }

      // Обновляем ссылку приглашения с актуальным seed и cloudBlobId
      const seed = encodeGroupSeed(mergedPayload);
      if (seed && mergedPayload.groupInfo) {
        mergedPayload.groupInfo = {
          ...mergedPayload.groupInfo,
          inviteLink: `https://vk.com/app${VK_MINI_APP_ID}#join=${code}&seed=${seed}`,
        };
      }

      setLocalGroupInRegistry(code, mergedPayload);

      // 3. Мгновенно оповещаем соседние вкладки браузера
      if (localBroadcastChannel) {
        try {
          localBroadcastChannel.postMessage({
            type: 'GROUP_UPDATED',
            code,
            payload: mergedPayload,
          });
        } catch {
          // Ignore
        }
      }

      // 4. Публикуем состояние в облачные каналы ntfy.sh (по коду, по названию группы и в каталог)
      const codeTopic = toCloudTopic('code', code);
      const nameTopic = toCloudTopic('name', mergedPayload.groupInfo?.name || code);

      const ntfyPromises = [
        publishToNtfyTopic(codeTopic, mergedPayload),
        publishToNtfyTopic(nameTopic, mergedPayload),
      ];

      if (options.registerInDirectory) {
        ntfyPromises.push(
          publishToNtfyTopic(GLOBAL_DIRECTORY_TOPIC, {
            code,
            name: mergedPayload.groupInfo?.name || code,
            university: mergedPayload.groupInfo?.university || '',
            course: mergedPayload.groupInfo?.course || '',
            cloudBlobId: mergedPayload.cloudBlobId || '',
            membersCount: (mergedPayload.members || []).length,
            updatedAt: mergedPayload.updatedAt,
          })
        );
      }

      const ntfyResults = await Promise.all(ntfyPromises);
      const cloudSavedOk = Boolean(savedBlobId) || ntfyResults.some(Boolean);

      // 5. Если настроен VK_BOT_TOKEN — дублируем в сообщения ВК
      const markerText = `📦 [GROUP_DB:${code}]\n${JSON.stringify(mergedPayload)}`;
      if (markerText.length <= VK_MESSAGE_LIMIT) {
        let vkPtr = getPointers()[code] || null;
        if (vkPtr?.msgId && vkPtr?.peerId) {
          await callVkApi('messages.edit', {
            peer_id: String(vkPtr.peerId),
            message_id: String(vkPtr.msgId),
            message: markerText,
          });
        } else {
          const targetPeer = preferredPeerId || getLaunchVkUserId();
          if (targetPeer) {
            const sendRes = await callVkApi('messages.send', {
              peer_id: String(targetPeer),
              random_id: String(Math.floor(Math.random() * 1e9)),
              message: markerText,
            });
            const newId = extractMessageId(sendRes);
            if (newId) {
              setPointer(code, { msgId: newId, peerId: targetPeer });
            }
          }
        }
      }

      return cloudSavedOk ? mergedPayload : mergedPayload;
    };

// Номер дня (UTC) для понедельника той недели, которая считается «текущей» (воскресенье = уже следующая неделя)
const mondayNum = (date) => {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  if (d.getDay() === 0) d.setDate(d.getDate() + 1);
  const dayNum = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  return dayNum - ((d.getDay() + 6) % 7);
};
const makeAnchor = (type = 'numerator', now = new Date()) => ({
  mondayNum: mondayNum(now),
  type: type === 'denominator' ? 'denominator' : 'numerator',
});
// Тип текущей недели считается автоматически по календарю от «якоря», заданного старостой
const computeWeek = (anchor, now = new Date()) => {
  const a = anchor && anchor.mondayNum ? anchor : makeAnchor('numerator', now);
  const counter = Math.round((mondayNum(now) - a.mondayNum) / 7);
  const flip = Math.abs(counter) % 2 === 1;
  const type = flip ? (a.type === 'numerator' ? 'denominator' : 'numerator') : a.type;
  return { counter, type };
};

const shuffleArray = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const normalizeGroupPayload = (d) => {
  const weekAnchor = d.weekAnchor || makeAnchor(d.currentAcademicWeekType || 'numerator');
  const counter = computeWeek(weekAnchor).counter;
  return {
    cloudBlobId: d.cloudBlobId || '',
    groupInfo: d.groupInfo,
    members: d.members || [],
    schedule: d.schedule || [],
    homeworks: (d.homeworks || []).map((hw) =>
      hw.dueWeek !== undefined
        ? hw
        : { ...hw, dueWeek: counter + (hw.targetWeekScope === 'next' ? 1 : 0) }
    ),
    queues: d.queues || [],
    funds: d.funds || [],
    botBroadcasts: d.botBroadcasts || [],
    dailyDeputyByDay: d.dailyDeputyByDay || EMPTY_DAILY_DEPUTY,

    deleteConfirmations: d.deleteConfirmations || { starosta: false, deputy: false },
    deletedIds: d.deletedIds || EMPTY_DELETED_IDS,

  };
};

      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }

      };

      applyLoadedGroupData(initialGroupPayload, 'u1');

      const savedPayload = await saveGroupByCode(
        generatedCode,
        initialGroupPayload,
        myVkId,
        { skipRemoteMerge: true, registerInDirectory: true }
      );
      if (savedPayload && savedPayload.groupInfo) {
        applyLoadedGroupData(savedPayload, 'u1');
      }

      setEntryRoleStep('starosta_created_code');
      showToast(`Группа «${grpName}» создана и сохранена в облаке! Код: ${generatedCode}`);
    } finally {
      setIsSyncingCloud(false);
    }
  };

  // Вход студента в существующую группу по коду, названию группы или ссылке (добавляет в общую группу к старосте)
  const handleStudentJoinGroup = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    const rawEntered = studentJoinForm.enteredCode.trim();
    const { code: cleanEntered } = extractCodeAndSeedFromInput(rawEntered);
    const studentName = studentJoinForm.studentName.trim();

    if (!cleanEntered) {
      setStudentJoinForm((prev) => ({
        ...prev,
        error: 'Пожалуйста, введите код группы, название группы или вставьте ссылку приглашения.',
      }));
      return;
    }

    if (!studentName) {
      setStudentJoinForm((prev) => ({
        ...prev,
        error: 'Пожалуйста, укажите ваше Имя и Фамилию.',
      }));
      return;
    }

    setIsSyncingCloud(true);
    try {
      await requestBotMessagesPermission();

      // 1. Сначала ищем существующую группу в облаке и реестре (по коду, названию или ссылке)
      const found = await fetchGroupByCode(rawEntered);
      if (!found || !found.data || !found.data.groupInfo) {
        setStudentJoinForm((prev) => ({
          ...prev,
          error: `Группа «${rawEntered}» не найдена в облаке. Проверьте код у старосты или выберите группу из списка ниже.`,
        }));
        return;
      }

      const targetGroup = found.data;
      const actualGroupCode = normalizeCodeKey(targetGroup.groupInfo.code);
      const myVkId = vkUser?.id ? String(vkUser.id) : getLaunchVkUserId();
      const normName = studentName.toLowerCase();
      const rawTag =
        studentJoinForm.studentVkTag.trim() ||
        (myVkId ? `@id${myVkId}` : '@vk_student');
      const normTag = rawTag.toLowerCase();

      // Проверка привязки студента к другой группе (студент не может состоять в двух группах одновременно)
      const existingBoundCode =
        studentGroupBindings[normName] ||
        (normTag && normTag !== '@vk_student' ? studentGroupBindings[normTag] : null) ||
        (myVkId ? studentGroupBindings[myVkId] : null);

      if (
        existingBoundCode &&
        normalizeCodeKey(existingBoundCode) !== actualGroupCode
      ) {
        setStudentJoinForm((prev) => ({
          ...prev,
          error: `Вы уже состоите в учебной группе с кодом «${existingBoundCode}». Студент может состоять только в одной группе.`,
        }));
        return;
      }

      if (
        groupInfo &&
        normalizeCodeKey(groupInfo.code) !== actualGroupCode
      ) {
        setStudentJoinForm((prev) => ({
          ...prev,
          error: `Вы уже состоите в группе «${groupInfo.name}» (${groupInfo.code}). Вступить во вторую группу нельзя, пока староста не исключит вас из текущей.`,
        }));
        return;
      }

      const currentMembers = targetGroup.members || [];
      const nowTs = Date.now();

      // 2. Проверяем, есть ли уже этот участник в списке группы (по VK ID, имени или тегу)
      const existingMember = currentMembers.find(
        (m) =>
          (myVkId && m.vkId && String(m.vkId) === String(myVkId)) ||
          m.name.trim().toLowerCase() === normName ||
          (normTag &&
            normTag !== '@vk_student' &&
            m.vkTag &&
            m.vkTag.trim().toLowerCase() === normTag)
      );

      let activeMemberId = '';
      let updatedMembers = currentMembers;

      if (existingMember) {
        activeMemberId = existingMember.id;
        updatedMembers = currentMembers.map((m) =>
          m.id === existingMember.id
            ? {
                ...m,
                name:
                  m.name === 'Староста группы' || m.name === 'Староста'
                    ? studentName
                    : m.name,
                vkId: myVkId || m.vkId || '',
                vkTag:
                  rawTag && rawTag !== '@vk_student'
                    ? rawTag
                    : m.vkTag || rawTag,
                subgroup: Number(studentJoinForm.subgroup) || m.subgroup || 1,
                groupCode: actualGroupCode,
                joinedAt: nowTs,
                updatedAt: nowTs,
              }
            : m
        );
        showToast(
          `С возвращением в группу «${targetGroup.groupInfo.name}», ${studentName}!`
        );
      } else {
        activeMemberId = myVkId ? `u_${myVkId}` : 'u_' + nowTs;
        const newStudent = {
          id: activeMemberId,
          vkId: myVkId,
          groupCode: actualGroupCode,
          name: studentName,
          vkTag: rawTag,
          subgroup: Number(studentJoinForm.subgroup) || 1,
          role: 'member',
          avatarColor: 'bg-emerald-600',
          joinedAt: nowTs,
          updatedAt: nowTs,
          permissions: {
            canManageHomework: false,
            canMarkAttendance: false,
            canEditSchedule: false,
            canManageQueues: false,
            canPostAnnouncements: false,
          },
        };
        updatedMembers = [...currentMembers, newStudent];
        showToast(
          `Вы успешно вступили в группу «${targetGroup.groupInfo.name}»! Участников: ${updatedMembers.length}`
        );
      }

      // Снимаем метку удаления для этого участника, если он вступает повторно
      const nextDeletedMembers = { ...(targetGroup.deletedIds?.members || {}) };
      delete nextDeletedMembers[activeMemberId];

      const updatedGroupPayload = {
        ...targetGroup,
        members: updatedMembers,
        deletedIds: {
          ...(targetGroup.deletedIds || EMPTY_DELETED_IDS),
          members: nextDeletedMembers,
        },
        updatedAt: nowTs,
      };

      applyLoadedGroupData(updatedGroupPayload, activeMemberId);

      setStudentGroupBindings((prev) => ({
        ...prev,
        [normName]: actualGroupCode,
        ...(normTag && normTag !== '@vk_student'
          ? { [normTag]: actualGroupCode }
          : {}),
        ...(myVkId ? { [myVkId]: actualGroupCode } : {}),
      }));

      const syncedGroup = await saveGroupByCode(
        actualGroupCode,
        updatedGroupPayload,
        myVkId,
        { registerInDirectory: true }
      );
      if (syncedGroup && syncedGroup.groupInfo) {
        applyLoadedGroupData(syncedGroup, activeMemberId);
      }

      setStudentJoinForm((prev) => ({ ...prev, error: '' }));
      setScreenMode('app');
    } finally {
      setIsSyncingCloud(false);
    }
  };

  // Отправка важного сообщения от имени единого бота ВК строго участникам ТЕКУЩЕЙ учебной группы
  const handleSendBotBroadcast = async (e) => {
    e.preventDefault();
    if (!effectivePermissions.canSendBotBroadcast) {
      showToast(
        'Отправлять важные сообщения от имени бота могут только староста и заместитель старосты.'
      );
      return;
    }
    if (!broadcastInput.text.trim()) {
      showToast('Введите текст важного сообщения для рассылки');
      return;
    }

    if (broadcastInput.text.length > 3000) {
      showToast('Сообщение слишком длинное (максимум 3000 символов).');
      return;
    }

    const now = new Date();
    const timeStr = now.toLocaleTimeString('ru-RU', {
      hour: '2-digit',
      minute: '2-digit',
    });

    // Подгружаем самый свежий список участников этой группы перед отправкой
    let currentGroupMembers = members;
    if (groupInfo?.code) {
      const latest = await fetchGroupByCode(groupInfo.code);
      if (latest?.data?.members?.length > 0) {
        currentGroupMembers = latest.data.members;
        setMembers(currentGroupMembers);
      }
    }

    const newBroadcast = {
      id: 'b_' + Date.now(),
      groupCode: groupInfo?.code || '',
      groupName: groupInfo?.name || '',
      title:
        broadcastInput.title.trim() ||
        'Важное сообщение для всех участников группы',
      text: broadcastInput.text.trim(),
      senderName: currentUser.name,
      senderRoleLabel:
        currentUser.role === 'starosta'
          ? 'Староста группы'
          : 'Заместитель старосты',
      time: `Сегодня, ${timeStr}`,
      urgent: broadcastInput.urgent,
      deliveredCount: 0,
      totalCount: 0,
    };

    setBotBroadcasts((prev) => [newBroadcast, ...prev]);
    setBroadcastInput({ title: '', text: '', urgent: true });

    // Отправка через единый VK_BOT_TOKEN (указанный в корне файла на GitHub)
    // Бот понимает, в какой именно группе находится отправитель (groupInfo.code),
    // и отправляет сообщения ТОЛЬКО участникам этой группы!
    const formattedVkText = `🎓 Группа «${groupInfo?.name || ''}» (${groupInfo?.university || ''})\n${
      newBroadcast.urgent ? '⚡ [ВАЖНО] ' : '📌 '
    }${newBroadcast.title}\n\n${newBroadcast.text}\n\n👤 Отправитель: ${
      newBroadcast.senderName
    } (${newBroadcast.senderRoleLabel})`;

    const targetPeerIds = new Set();
    currentGroupMembers.forEach((m) => {
      if (m.groupCode && groupInfo?.code && m.groupCode !== groupInfo.code) {
        return;
      }
      if (m.vkId && /^\d+$/.test(String(m.vkId))) {
        targetPeerIds.add(String(m.vkId));
      } else {
        const rawTag = String(m.vkTag || '');
        const matchId = rawTag.match(/(\d{5,15})/);
        if (matchId && matchId[1]) {
          targetPeerIds.add(matchId[1]);
        }
      }
    });

    const peerList = [...targetPeerIds];
    let delivered = 0;
    for (let i = 0; i < peerList.length; i += 100) {
      const chunk = peerList.slice(i, i + 100);
      const res = await callVkApi('messages.send', {
        peer_ids: chunk.join(','),
        random_id: String(Math.floor(Math.random() * 1e9)),
        message: formattedVkText,
      });
      if (Array.isArray(res?.response)) {
        delivered += res.response.filter((x) => !x.error).length;
      }
    }

    setBotBroadcasts((prev) =>
      prev.map((b) =>
        b.id === newBroadcast.id
          ? { ...b, deliveredCount: delivered, totalCount: peerList.length }
          : b
      )
    );
    showToast(
      delivered === peerList.length
        ? `🤖 Сообщение доставлено ${delivered} из ${peerList.length} чел.`
        : `🤖 Доставлено ${delivered} из ${peerList.length}. Остальные не разрешили сообщения от бота — пусть откроют приложение и нажмут «Разрешить».`
    );
  };

  // Helper to get homeworks for a schedule slot
  const getHomeworksForPair = (scheduleId, scopeFilter = null) => {
    return homeworks.filter((hw) => {
      if (hw.scheduleId !== scheduleId) return false;

    });

  const saveHomework = () => {
    if (!hwModal.scheduleId) {
      showToast('Выберите пару из расписания!');
      return;

    if (!hwModal.title.trim()) {

      return;

    const now = new Date();
    const timeStr = now.toLocaleTimeString('ru-RU', {
      hour: '2-digit',
      minute: '2-digit',
    });
    if (hwModal.mode === 'add') {
      const newHw = {
        id: 'hw_' + Date.now(),
        scheduleId: hwModal.scheduleId,
        targetWeekScope: hwModal.targetWeekScope,
        dueWeek: currentWeekCounter + (hwModal.targetWeekScope === 'next' ? 1 : 0),
        title: hwModal.title.trim(),
        description: hwModal.description.trim(),
        attachment: hwModal.attachment.trim(),
        priority: hwModal.priority,
        authorName: currentUser.name,
        updatedAt: `Сегодня, ${timeStr}`,
        completedBy: [],
      };
      setHomeworks((prev) => [newHw, ...prev]);
      showToast('Домашнее задание добавлено к паре!');
    } else {
      setHomeworks((prev) =>
        prev.map((item) =>
          item.id === hwModal.hwId
            ? {
                ...item,
                scheduleId: hwModal.scheduleId,
                targetWeekScope: hwModal.targetWeekScope,
        dueWeek: currentWeekCounter + (hwModal.targetWeekScope === 'next' ? 1 : 0),
                title: hwModal.title.trim(),
                description: hwModal.description.trim(),
                attachment: hwModal.attachment.trim(),
                priority: hwModal.priority,
                authorName: currentUser.name,
                updatedAt: `Изменено в ${timeStr}`,
              }
            : item
        )
      );
      showToast('Домашнее задание обновлено!');
    }
    setHwModal((prev) => ({ ...prev, open: false }));
  };

  const deleteHomework = (hwId) => {
    if (!effectivePermissions.canManageHomework) {
      showToast('Нет доступа к удалению ДЗ');
      return;
    }
    setDeletedIds((prev) => ({
      ...prev,
      homeworks: { ...(prev.homeworks || {}), [hwId]: Date.now() },
    }));
    setHomeworks((prev) => prev.filter((h) => h.id !== hwId));
    showToast('Домашнее задание удалено');
  };

  const toggleHomeworkCompleted = (hwId) => {
    setHomeworks((prev) =>
      prev.map((hw) => {
        if (hw.id !== hwId) return hw;
        const done = hw.completedBy.includes(currentUser.id);
        return {
          ...hw,
          completedBy: done
            ? hw.completedBy.filter((id) => id !== currentUser.id)
            : [...hw.completedBy, currentUser.id],
        };
      })
    );
  };

  // Toggle member permission
  const toggleMemberPermission = (memberId, permKey) => {
    if (!effectivePermissions.canManageRoles) {
      showToast('Только староста или зам может менять права участников');
      return;
    }
    setMembers((prev) =>
      prev.map((m) => {
        if (m.id !== memberId) return m;
        if (m.role === 'starosta') return m;
        return {
          ...m,
          permissions: {
            ...m.permissions,
            [permKey]: !m.permissions[permKey],
          },
        };
      })
    );
    showToast('Права доступа участника обновлены');
  };

  // Appoint or clear Daily Replacement (ONLY Starosta can appoint)
  const appointDailyDeputy = (dayId, memberIdOrNull) => {
    if (currentUser.role !== 'starosta') {
      showToast('Назначать человека на день может только лично староста!');
      return;
    }
    setDailyDeputyByDay((prev) => ({
      ...prev,
      [dayId]: memberIdOrNull || null,
    }));
    if (!memberIdOrNull) {
      showToast('Назначение на выбранный день снято.');
    } else {
      const chosen = members.find((m) => m.id === memberIdOrNull);
      if (chosen) {
        showToast(
          `Староста назначил(а) на ${
            DAYS.find((d) => d.id === dayId)?.full
          }: ${chosen.name}`
        );
      }
    }
  };

  const pickRandomDailyDeputy = (dayId) => {
    if (currentUser.role !== 'starosta') {
      showToast('Назначать человека на день может только староста!');
      return;
    }
    const candidates = members.filter(
      (m) => m.role !== 'starosta' && m.role !== 'deputy'
    );
    if (candidates.length === 0) {
      showToast('Сначала добавьте студентов в группу, чтобы выбрать замену на день.');

      showToast(`Староста назначил(а) на день (случайно): ${randomMember.name}`);
    }
  };

  // Schedule Pair Creation & Deletion
  const handleAddSchedulePair = () => {
    if (!pairModal.subject.trim()) {
      showToast('Укажите название предмета');
      return;
    }
    const newPair = {
      id: 's_' + Date.now(),
      weekType: pairModal.weekType,
      day: pairModal.day,
      pairNumber: Number(pairModal.pairNumber),
      time: pairModal.time,
      subject: pairModal.subject.trim(),
      type: pairModal.type,
      room: pairModal.room.trim() || 'Ауд. не указана',
      teacher: pairModal.teacher.trim() || 'Преподаватель не указан',
      subgroup: Number(pairModal.subgroup),
    };
    setSchedule((prev) => [...prev, newPair]);
    if (!attendanceSelectedPairId) {
      setAttendanceSelectedPairId(newPair.id);
    }
    setPairModal((prev) => ({
      ...prev,
      open: false,
      subject: '',
      room: '',
      teacher: '',
    }));
    showToast('Пара добавлена в расписание');
  };

  const deleteSchedulePair = (pairId) => {
    if (!effectivePermissions.canEditSchedule) {
      showToast('Нет прав на удаление пары из расписания');
      return;
    }
    setDeletedIds((prev) => ({
      ...prev,
      schedule: { ...(prev.schedule || {}), [pairId]: Date.now() },
    }));
    setSchedule((prev) => prev.filter((p) => p.id !== pairId));
    setHomeworks((prev) => prev.filter((hw) => hw.scheduleId !== pairId));
    showToast('Пара удалена из расписания');
  };

  // Attendance helpers
  const setStudentAttendance = (scheduleId, studentId, status) => {
    if (!effectivePermissions.canMarkAttendance) {
      showToast('У вас нет прав отмечать посещаемость');
      return;
    }
    setAttendance((prev) => ({
      ...prev,
      [`${attendanceDate}|${scheduleId}|${studentId}`]: status,
    }));
  };

  const markAllPresent = (scheduleId) => {

      return;
    }
    if (!scheduleId) {
      showToast('Сначала выберите пару из расписания');

    showToast('Все участники отмечены как присутствующие');

  // Filtered schedule for current view
  const filteredSchedule = useMemo(() => {

      .filter((s) => s.weekType === activeWeekType && s.day === selectedDay)
      .filter(
        (s) =>
          selectedSubgroup === 0 ||
          s.subgroup === 0 ||
          s.subgroup === selectedSubgroup
      )
      .sort((a, b) => a.pairNumber - b.pairNumber);
  }, [schedule, activeWeekType, selectedDay, selectedSubgroup]);

  // Next week homework grouped by day & pair
  const nextWeekHomeworksGrouped = useMemo(() => {
    return DAYS.map((d) => {
      const pairsOnDay = schedule
        .filter((s) => s.weekType === nextAcademicWeekType && s.day === d.id)
        .sort((a, b) => a.pairNumber - b.pairNumber);

        );

        day: d,
        pairsWithHw,

      };

  }, [schedule, homeworks, nextAcademicWeekType, currentWeekCounter]);

  // Homework Managers list
  const homeworkManagers = useMemo(() => {
    return members.filter(
      (m) =>
        m.role === 'starosta' ||
        m.permissions?.canManageHomework ||
        dailyDeputyByDay[selectedDay] === m.id
    );
  }, [members, dailyDeputyByDay, selectedDay]);

  // Absence label helper
  const currentAbsenceText = useMemo(() => {
    const reason = dailyAbsenceReasonByDay[selectedDay] || 'both_absent';
    if (reason === 'both_absent') {
      return `Староста (${permanentStarostaMember.name}) и заместитель старосты (${permanentDeputyMember.name}) сегодня отсутствуют`;

  }, [
    dailyAbsenceReasonByDay,
    selectedDay,
    permanentStarostaMember,
    permanentDeputyMember,
  ]);

  // ==================== ONBOARDING / ROLE SELECTION SCREEN (CLEAN, NO DEMO DATA) ====================
  if (screenMode === 'entry') {
    return (
      <div
        className={`min-h-screen font-sans flex flex-col justify-between p-4 sm:p-6 transition-colors ${
          darkMode
            ? 'bg-slate-950 text-slate-100'
            : 'bg-[#EBEDF0] text-slate-900'
        }`}
      >
        {/* Top bar */}
        <div className="max-w-3xl w-full mx-auto flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-10 h-10 rounded-2xl bg-[#2688EB] flex items-center justify-center text-white shadow-sm">
              <GraduationCap className="w-6 h-6" />
            </div>
            <div>
              <span className="font-bold text-base tracking-tight">
                Староста.ВК
              </span>
              <span className="ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-[#2688EB]/15 text-[#2688EB]">
                Органайзер группы
              </span>
            </div>
          </div>
